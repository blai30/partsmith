name: Platforms

# Times the full rebuild of technical design section 14 on the macOS arm64 runner (full-rebuild, delivery.md 2.14,
# ADR 0054), after a copy of the macos-15 row of ci.yml's occt-platforms. The Windows, macOS and engine jobs that ran
# here moved into ci.yml in wave H (delivery.md 2.14, The move, ADR 0038). Neither job left here is promoted.
# It gates nothing: no job of ci.yml or release.yml waits for it. A release waits for a passing run on its commit
# (delivery.md 3.6).
# Start a run with: gh workflow run platforms.yml --ref main
on:
  schedule:
    # Mondays at 05:41 UTC, off the hour, when scheduled runs are delayed least. A week without a change to main
    # still runs, because the runner images and their toolchains change.
    - cron: "41 5 * * 1"
  workflow_dispatch:

# A second run waits for the running one instead of canceling an OCCT build before it saves its cache.
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ci.yml's env, entry for entry (delivery.md 2.14).
env:
  CARGO_TERM_COLOR: always
  OCCT_ROOT: ${{ github.workspace }}/.occt/native
  CARGO_PROFILE_DEV_DEBUG: "0"

# Every job sets timeout-minutes, so a hung job ends long before GitHub's default of 360 minutes (delivery.md 2.14).
# No step sets continue-on-error: a failure here is work to do, recorded in delivery.md open issue 1 until it is fixed.
jobs:
  # ci.yml's occt-platforms line for line, but for its name and its one row, the macos-15 row that full-rebuild needs
  # (delivery.md 2.14, promotion step 1). Its own name keeps its check apart from ci.yml's OCCT (macos-15), which
  # branch protection requires (delivery.md 2.14, The move, choice 3). Its Windows step never runs.
  occt-platforms:
    name: OCCT for the full rebuild (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    # A cold occt-platforms job took 21 minutes on macOS (2026-10-26, delivery.md open issue 16) and 1 h 10 min 21 s
    # on Windows (platforms run 14, delivery.md open issue 1 (e)).
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - id: occt
        uses: actions/cache@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
      # MSVC, CMake and Ninja from Visual Studio on PATH, needed only for a build.
      - if: runner.os == 'Windows' && steps.occt.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # The oldest macOS the app supports (desktop.md 2.8).
      - if: runner.os == 'macOS' && steps.occt.outputs.cache-hit != 'true'
        name: Install Ninja and set the deployment target
        run: |
          brew install ninja
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      # OCCT_JOBS spares the script nproc, which macOS lacks.
      - if: steps.occt.outputs.cache-hit != 'true'
        env:
          OCCT_JOBS: 4
        run: scripts/build-occt.sh native "$OCCT_ROOT"
      # A cold OCCT build is the largest user of the runner's disk (delivery.md open issue 16).
      - name: Disk space after the build
        if: always()
        run: df -h .

  # Technical design section 14's full-rebuild gate, judged on this macOS arm64 runner (delivery.md 2.14, ADR 0054).
  # It gates nothing and never moves into ci.yml: a median over the budget warns, and the owner decides.
  full-rebuild:
    name: Full rebuild of bench50 (macos-15)
    needs: occt-platforms
    # ADR 0054 decision 2. A copy that fails with its OCCT already saved (a failed checkout, say) does not skip the
    # measurement. After a failed cold build the job fails at its restore, whose message names the missing cache.
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # The macOS that OCCT and the app are built for (desktop.md 2.8).
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      # Release builds of the benchmark's dependencies, kept apart from the debug builds of ci.yml's rust-platforms by
      # rust-cache's job key, and saved on main alone.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The benchmark builds in the release profile and times the median of 7 runs of bench50, each on a new Recompute.
      - name: Time the full rebuild of bench50
        env:
          OPERATION: run of bench50 from an empty cache
        run: |
          # The benchmark exits 1 when the median is over its budget, which is the owner's call (ADR 0054). Its exit
          # status is not used: the row it prints decides.
          output="$(cargo bench -p partsmith-recompute --bench budgets -- "$OPERATION")" || true
          echo "$output"
          # The row that partsmith-budgets' Report prints: the operation, two spaces, the median, the word budget
          # and the budget.
          row="$(awk -v operation="$OPERATION" 'index($0, operation "  ") == 1 { print $(NF - 2), $NF }' <<< "$output")"
          if [ -z "$row" ]; then
            echo "::error title=Full rebuild not measured::The benchmark printed no row for $OPERATION. The build or the benchmark failed, or bench50 is missing: the lines above say which (docs/spec/delivery.md section 2.14)."
            exit 1
          fi
          read -r median budget <<< "$row"
          verdict="Within the budget of technical design section 14."
          if grep -q -F "Over budget: $OPERATION (" <<< "$output"; then
            verdict="Over the budget of technical design section 14. The owner decides with an ADR that raises the budget or schedules speed work (ADR 0054)."
            echo "::warning title=Full rebuild over budget::The median of $OPERATION is $median, over its budget of $budget (technical design section 14). The owner decides with an ADR that raises the budget or schedules speed work (ADR 0054)."
          fi
          {
            echo "## Full rebuild of bench50"
            echo
            echo "| Runner | Operation | Median | Budget |"
            echo "| --- | --- | --- | --- |"
            echo "| $RUNNER_OS $RUNNER_ARCH | $OPERATION | $median | $budget |"
            echo
            echo "$verdict"
          } >> "$GITHUB_STEP_SUMMARY"
