name: Platforms

# What CI does not test on every pull request (delivery.md 2.14, ADR 0038): the crates whose code differs by platform
# and the examples runner on Windows and macOS, and the end-to-end tests tagged @engines in Firefox and WebKit.
# It gates nothing: no job of ci.yml or release.yml waits for it. A job, or one row of its matrix, moves into ci.yml
# once it has passed in the two latest runs on main (gh run list --workflow platforms.yml --branch main), following the
# promotion steps of delivery.md 2.14. Start a run with: gh workflow run platforms.yml --ref main
on:
  schedule:
    # Mondays at 05:41 UTC, off the hour, when scheduled runs are delayed least. A week without a change to main
    # still runs, because the runner images and their toolchains change.
    - cron: "41 5 * * 1"
  workflow_dispatch:

# A second run waits for the running one instead of canceling an OCCT build before it saves its cache.
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OCCT_ROOT: ${{ github.workspace }}/.occt/native
  # Without debug info the test binaries that link OCCT statically stay small and link fast (delivery.md 3.2).
  CARGO_PROFILE_DEV_DEBUG: "0"

# Every job sets timeout-minutes, so a hung job ends long before GitHub's default of 360 minutes (delivery.md 2.14).
# No step sets continue-on-error: a failure here is work to do, recorded in delivery.md open issue 1 or ui.md open
# issue 41 until it is fixed.
jobs:
  # A job of its own, so a cold OCCT build is saved even when the tests after it fail: actions/cache saves in its post
  # step only when its job succeeds. The steps and the key are those of release.yml's bundle job.
  occt-platforms:
    name: OCCT (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    # A cold occt-platforms job took 48 minutes on Windows and 21 on macOS (2026-10-26, delivery.md open issue 16).
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - id: occt
        uses: actions/cache@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
      # MSVC, CMake and Ninja from Visual Studio on PATH, needed only for a build.
      - if: runner.os == 'Windows' && steps.occt.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # The oldest macOS the app supports (desktop.md 2.8).
      - if: runner.os == 'macOS' && steps.occt.outputs.cache-hit != 'true'
        name: Install Ninja and set the deployment target
        run: |
          brew install ninja
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      # OCCT_JOBS spares the script nproc, which macOS lacks.
      - if: steps.occt.outputs.cache-hit != 'true'
        env:
          OCCT_JOBS: 4
        run: scripts/build-occt.sh native "$OCCT_ROOT"
      # A cold OCCT build is the largest user of the runner's disk (delivery.md open issue 16).
      - name: Disk space after the build
        if: always()
        run: df -h .

  rust-platforms:
    name: Rust tests (${{ matrix.runner }})
    needs: occt-platforms
    # needs waits for both OCCT rows; without this, one runner's failed build would skip the tests on both.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      # MSVC on PATH for the shim of partsmith-occt-sys.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # Git Bash puts GNU link (/usr/bin/link) ahead of MSVC's link.exe on PATH, and rustc takes the first one
      # when VCINSTALLDIR is set, so Cargo gets the link.exe next to cl.exe, the one CMake uses for OCCT.
      - if: runner.os == 'Windows'
        name: Use the MSVC linker for Rust
        run: |
          linker="$(dirname "$(command -v cl)")/link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$linker")" >> "$GITHUB_ENV"
      # The shim and the test binaries are built for the macOS that OCCT and the app are built for.
      - if: runner.os == 'macOS'
        name: Set the deployment target
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      # Only a row whose own OCCT is missing fails here.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      # Saved on main alone, where every later run can restore it, and also when the tests fail, since its post step
      # otherwise saves only after a passing job: a run while a failure is being fixed then restores the dependency
      # builds of the one before instead of building them cold (delivery.md 3.2).
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # --no-fail-fast, so one failing test binary does not hide the others. A hung test binary ends this step, so the
      # examples runner and clippy still run (delivery.md open issue 1 (g)).
      - id: crates
        timeout-minutes: 20
        run: cargo test --no-fail-fast -p partsmith-occt-sys -p partsmith-engine -p partsmith-desktop
      # The expected results blessed on Linux, at the tolerance of delivery.md 2.8. A block scalar, since a plain YAML
      # value cannot end in a colon.
      - if: ${{ !cancelled() && steps.crates.outcome != 'skipped' }}
        run: |
          cargo test -p partsmith-cli --test integration examples::
      # CI's workspace clippy runs on Linux only and never sees code behind #[cfg(windows)] or
      # #[cfg(target_os = "macos")], such as desktop.md tests 68 to 70.
      - if: ${{ !cancelled() && steps.crates.outcome != 'skipped' }}
        run: cargo clippy -p partsmith-occt-sys -p partsmith-engine -p partsmith-desktop --all-targets -- -D warnings
      - name: Disk space after the tests
        if: always()
        run: df -h .

  # ci.yml's occt-wasm, step for step, so a run after GitHub dropped that cache (7 days unused) builds it.
  occt-wasm:
    name: OCCT (WebAssembly)
    runs-on: ubuntu-24.04
    # A cold OCCT build for WebAssembly takes about an hour and a half (88 minutes on 2026-10-13).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          scripts/build-occt.sh wasm "$GITHUB_WORKSPACE/.occt/wasm"

  # ci.yml's core-wasm without the native OCCT, the web_module round trip and the web_parity comparison, which CI runs
  # on every change.
  core-wasm:
    name: Web core (WebAssembly)
    needs: occt-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OCCT_ROOT_WASM32_UNKNOWN_EMSCRIPTEN: ${{ github.workspace }}/.occt/wasm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
          fail-on-cache-miss: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: scripts/build-wasm.sh
      # The web notices go wherever the core goes. With two paths, the artifact is rooted at ui/public/.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: core-wasm
          path: |
            ui/public/core/
            ui/public/THIRD-PARTY-NOTICES.txt
          retention-days: 7
          if-no-files-found: error

  # ci.yml's e2e for one engine. Playwright runs the firefox and webkit projects only when --project names them, and
  # each runs the tests tagged @engines (ui.md 6.8). Firefox runs headed, so the run has a virtual display; WebKit
  # stays headless.
  e2e-engines:
    name: End-to-end tests (${{ matrix.browser }})
    needs: core-wasm
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-wasm
          path: ui/public
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Its time is apt's download from the Ubuntu mirror, under 3 minutes on most runs and up to 53 on a slow mirror
      # (delivery.md 2.14 and open issue 16). The timeout ends such an install under this step's name, so the row fails
      # at about 11 minutes instead of running into the job's 60.
      - name: Install ${{ matrix.browser }} and its system packages
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run --auto-servernum pnpm e2e --project ${{ matrix.browser }}
      # Its traces can hold the files the page loaded, the core among them, so it is kept 7 days like the others.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7
