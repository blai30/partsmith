name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OCCT_ROOT: ${{ github.workspace }}/.occt/native

jobs:
  occt-native:
    name: OCCT (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          scripts/build-occt.sh native "$OCCT_ROOT"

  occt-wasm:
    name: OCCT (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          scripts/build-occt.sh wasm "$GITHUB_WORKSPACE/.occt/wasm"

  kernel-wasm:
    name: Kernel tests (WebAssembly)
    needs: occt-wasm
    runs-on: ubuntu-24.04
    env:
      OCCT_ROOT_WASM32_UNKNOWN_EMSCRIPTEN: ${{ github.workspace }}/.occt/wasm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
          fail-on-cache-miss: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test -p partsmith-occt-sys --target wasm32-unknown-emscripten

  rust:
    name: Rust
    needs: occt-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      # partsmith-desktop is a workspace member, so the workspace builds need Tauri's Linux packages.
      - name: Install the Tauri Linux packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: License and advisory policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  ui:
    name: UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts

  schema:
    name: Generated files
    needs: occt-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cargo run -p partsmith-cli -- schema --write
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui generate:protocol
      - name: Check that the generated files are up to date
        run: |
          changes="$(git status --porcelain -- docs/format ui/src/generated)"
          if [ -n "$changes" ]; then
            echo "::error::Generated files are out of date. Run: cargo run -p partsmith-cli -- schema --write && pnpm -C ui generate:protocol"
            # The status also names added files, which the diff leaves out.
            echo "$changes"
            git diff -- docs/format ui/src/generated
            exit 1
          fi

  core-wasm:
    name: Web core (WebAssembly)
    needs: [occt-native, occt-wasm]
    runs-on: ubuntu-24.04
    env:
      OCCT_ROOT_WASM32_UNKNOWN_EMSCRIPTEN: ${{ github.workspace }}/.occt/wasm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
          fail-on-cache-miss: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: scripts/build-wasm.sh
      # The Node round trip against the module just built.
      - run: cargo test -p partsmith-wasm --test web_module
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: core-wasm
          path: ui/public/core/
          retention-days: 7
          if-no-files-found: error

  web:
    name: Web build
    needs: core-wasm
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-wasm
          path: ui/public/core
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: ui/dist/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    needs: core-wasm
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-wasm
          path: ui/public/core
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/

  python:
    name: Python
    needs: occt-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      # maturin develop installs into the active virtual environment, so later steps activate it.
      - name: Create a virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install maturin==1.15.0 pytest==9.1.1
      - run: maturin develop --release
        working-directory: python
      - run: pytest python/tests

  desktop:
    name: Desktop (Linux)
    needs: occt-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - name: Install the Tauri Linux packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      # No WebAssembly core: the desktop app does not load it.
      - run: pnpm -C ui build
      - id: tauri-cli
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.12.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - run: cargo tauri build --bundles deb
        working-directory: desktop/src-tauri
      - name: Check the package
        run: |
          shopt -s nullglob
          packages=(target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .deb under target/release/bundle/deb/, found ${#packages[@]}."
            exit 1
          fi
          # The sixth column of dpkg-deb --contents is the path.
          paths="$(dpkg-deb --contents "${packages[0]}" | awk '{ print $6 }')"
          if ! grep -qx './usr/bin/partsmith-desktop' <<<"$paths"; then
            echo "::error::${packages[0]} does not contain ./usr/bin/partsmith-desktop."
            exit 1
          fi
          launchers="$(grep -c '^\./usr/share/applications/[^/]*\.desktop$' <<<"$paths" || true)"
          if [ "$launchers" -ne 1 ]; then
            echo "::error::${packages[0]} has $launchers .desktop files under ./usr/share/applications/, expected exactly one."
            exit 1
          fi
          echo "${packages[0]} contains ./usr/bin/partsmith-desktop and one .desktop file."

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [kernel-wasm, rust, deny, ui, schema, web, e2e, python, desktop]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Cloudflare secrets are not available to this run (a fork, or the repository is not configured), so nothing was deployed."
          fi
      - if: steps.secrets.outputs.available == 'true'
        uses: actions/checkout@v7.0.1
      - if: steps.secrets.outputs.available == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: ui/dist
      - if: steps.secrets.outputs.available == 'true'
        id: pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: >-
            pages deploy ui/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'partsmith' }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
      - if: steps.secrets.outputs.available == 'true'
        run: echo "Deployed to ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
