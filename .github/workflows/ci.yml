name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run of the same ref cancels this one, an OCCT build that has not ended included. The next run builds OCCT
# again (delivery.md 2.14, choice 1).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OCCT_ROOT: ${{ github.workspace }}/.occt/native
  # Without debug info the test binaries that link OCCT statically stay small and link fast (delivery.md 3.2).
  CARGO_PROFILE_DEV_DEBUG: "0"

# Every job sets timeout-minutes, so a hung job ends long before GitHub's default of 360 minutes (delivery.md 2.4).
jobs:
  occt-native:
    name: OCCT (native)
    runs-on: ubuntu-24.04
    # A cold OCCT build takes about an hour (56 minutes on 2026-10-13).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          scripts/build-occt.sh native "$OCCT_ROOT"

  occt-wasm:
    name: OCCT (WebAssembly)
    runs-on: ubuntu-24.04
    # A cold OCCT build for WebAssembly takes about an hour and a half (88 minutes on 2026-10-13).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          scripts/build-occt.sh wasm "$GITHUB_WORKSPACE/.occt/wasm"

  kernel-wasm:
    name: Kernel tests (WebAssembly)
    needs: occt-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OCCT_ROOT_WASM32_UNKNOWN_EMSCRIPTEN: ${{ github.workspace }}/.occt/wasm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
          fail-on-cache-miss: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test -p partsmith-occt-sys --target wasm32-unknown-emscripten
      # The sketch suite under Node, held to native values (sketch.md 3.12, test 255).
      - run: cargo test -p partsmith-sketch --target wasm32-unknown-emscripten
      # The engine's panic containment under Node (protocol.md test 84).
      # A block scalar, since a plain YAML value cannot end in a colon.
      - run: |
          cargo test -p partsmith-engine --lib --target wasm32-unknown-emscripten dispatch::

  rust:
    name: Rust
    needs: occt-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      # Margin for the workspace build and its OCCT-linked test binaries; df shows what is left (delivery.md 3.2).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The apt cache of delivery.md 3.2: the .deb files of the Tauri Linux packages, one entry for rust and desktop.
      # The newest entry is restored before the install. On main, a new entry is saved after it when the install
      # downloaded a package the entry lacked.
      - name: Restore the apt archives of the Tauri Linux packages
        id: apt-archives
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-ubuntu-24.04-tauri-${{ github.run_id }}
          restore-keys: apt-archives-ubuntu-24.04-tauri-
      - name: Copy the apt archives into apt's cache
        if: steps.apt-archives.outputs.cache-matched-key != ''
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # partsmith-desktop is a workspace member, so the workspace builds need Tauri's Linux packages. When the apt
      # cache misses, its time is apt's download from the Ubuntu mirror: 26 min 26 s in the CI run on wave H2's branch,
      # where desktop fetched the same packages in 7 s (delivery.md open issue 16). The job's 60 minutes bound it
      # (delivery.md 3.2).
      - name: Install the Tauri Linux packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      # Saved right after the install, before cargo builds. The entry's files stay in ~/apt-archives, about 61 MB
      # against the job's disk margin (delivery.md 3.2).
      - name: Copy the apt archives out of apt's cache
        id: copy-out
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          export LC_ALL=C
          dpkg-query -W -f '${Package}_${Version}_${Architecture}.deb\n' | sed 's/:/%3a/g' | sort > "$RUNNER_TEMP/apt-installed"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -12 - "$RUNNER_TEMP/apt-installed" > "$RUNNER_TEMP/apt-current"
          mkdir -p ~/apt-archives
          find ~/apt-archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -23 "$RUNNER_TEMP/apt-current" - > "$RUNNER_TEMP/apt-downloaded"
          if [ -s "$RUNNER_TEMP/apt-downloaded" ]; then
            rm -rf ~/apt-archives
            mkdir ~/apt-archives
            (cd /var/cache/apt/archives && xargs -a "$RUNNER_TEMP/apt-current" cp -t ~/apt-archives)
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the apt archives of the Tauri Linux packages
        if: steps.copy-out.outputs.downloaded == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Disk space after the tests
        if: always()
        run: df -h /

  deny:
    name: License and advisory policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  ui:
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm check:licenses

  schema:
    name: Generated files
    needs: occt-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # First, since it needs nothing the schema steps make, so a failure there leaves the packages
      # the notices check reads.
      - id: install
        run: pnpm -C ui install --frozen-lockfile
      - run: cargo run -p partsmith-cli -- schema --write
      - run: pnpm -C ui generate:protocol
      - name: Check that the generated files are up to date
        run: |
          changes="$(git status --porcelain -- docs/format ui/src/generated)"
          if [ -n "$changes" ]; then
            echo "::error::Generated files are out of date. Run: cargo run -p partsmith-cli -- schema --write && pnpm -C ui generate:protocol"
            # The status also names added files, which the diff leaves out.
            echo "$changes"
            git diff -- docs/format ui/src/generated
            exit 1
          fi
      # Runs after a failure of the steps above too, so that one does not hide a notices failure,
      # but only with the packages installed.
      - name: Check that the third-party notices are up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C ui check:notices

  # The source of everything this run builds, uploaded before any job uploads OCCT's compiled code, and kept a day
  # longer than those artifacts (delivery.md 2.13, The source with every artifact). Every job that uploads an artifact
  # needs it. A failure here skips them all. web copies these files into the deployment.
  sources:
    name: Source archives (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      # The OCCT source archive, made once per pin. The cache's post step saves it when the job passes.
      - id: occt-source
        uses: actions/cache@v6.1.0
        with:
          path: .occt/source
          key: occt-source-${{ hashFiles('scripts/occt-source-archive.sh', 'scripts/occt-version.sh') }}
      - if: steps.occt-source.outputs.cache-hit != 'true'
        run: |
          mkdir -p .occt/source
          scripts/occt-source-archive.sh .occt/source
      # cargo vendor and cargo metadata of the dependency script need the toolchain of rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      # It checks the archive's commit, as deploy does, and prints its SHA-256. It warns, without failing, when
      # the runner's git or gzip wrote other bytes than the ones 2.13 measured.
      - name: Write the OCCT source archive
        env:
          OCCT_SOURCE_SHA256: bb71bf7473f9a278648f3ff96e28bd50afe49bf8d6e53ab55e883b54d0220155
        run: |
          source scripts/occt-version.sh
          archive="occt-$OCCT_VERSION-source.tar.gz"
          mkdir sources
          cp ".occt/source/$archive" sources/
          if ! scripts/check-source-archive.sh "sources/$archive" "$OCCT_COMMIT"; then
            echo "::error title=OCCT source missing::sources/$archive from the cache .occt/source is not a whole gzip file or does not hold the source of the OCCT commit $OCCT_COMMIT, so nothing was uploaded. Delete that cache entry (gh cache list --key occt-source-) and run the job again, which makes the archive anew (docs/spec/delivery.md section 2.13)."
            exit 1
          fi
          sha256="$(sha256sum "sources/$archive" | cut -d ' ' -f 1)"
          echo "$sha256  $archive"
          if [ "$sha256" != "$OCCT_SOURCE_SHA256" ]; then
            echo "::warning title=OCCT source archive changed::$archive has the SHA-256 $sha256, not $OCCT_SOURCE_SHA256, the one docs/spec/delivery.md section 2.13 records. A new pin, git or gzip wrote other bytes: record the new SHA-256 there and in OCCT_SOURCE_SHA256 of each step Write the OCCT source archive."
          fi
      # git archive of the checked-out commit, GITHUB_SHA.
      - name: Write the Partsmith source archive
        run: scripts/partsmith-source-archive.sh sources
      # The source of every Rust crate and npm package the web build is made from, as parts with their SHA256SUMS.
      # LC_ALL has a line of its own: the shell sorts the glob in that locale too.
      - name: Write the dependency source archives
        run: |
          mkdir sources/dependencies
          node scripts/dependency-source-archive.mjs web sources/dependencies
          cd sources/dependencies
          export LC_ALL=C
          sha256sum -- * > SHA256SUMS
      # The files are gzip files and tars of gzip files, which zip does not shrink.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sources-web
          path: sources/
          retention-days: 8
          if-no-files-found: error
          compression-level: 0

  core-wasm:
    name: Web core (WebAssembly)
    # sources uploads the core's source first.
    needs: [occt-native, occt-wasm, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OCCT_ROOT_WASM32_UNKNOWN_EMSCRIPTEN: ${{ github.workspace }}/.occt/wasm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/wasm
          key: occt-wasm-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh', 'scripts/emsdk-version.sh') }}
          fail-on-cache-miss: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: scripts/build-wasm.sh
      # The Node round trip against the module just built. The variable turns a skip into a failure (test 7).
      # A block scalar, since a plain YAML value cannot end in a colon.
      - run: |
          cargo test -p partsmith-wasm --test integration web_module::
        env:
          PARTSMITH_REQUIRE_WEB_MODULE: "1"
      # The module just built against a native session over the engine fixtures and the examples (engine.md test 154).
      # Ignored by default, since a module built from another tree fails it; asked for, it fails instead of skipping.
      # A block scalar, since a plain YAML value cannot hold a colon followed by a space.
      - run: |
          cargo test -p partsmith-wasm --test integration web_parity:: -- --ignored
      # The web notices go wherever the core goes. With two paths, the artifact is rooted at ui/public/.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: core-wasm
          path: |
            ui/public/core/
            ui/public/THIRD-PARTY-NOTICES.txt
          retention-days: 7
          if-no-files-found: error

  web:
    name: Web build
    needs: [core-wasm, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      # The notices file it writes is the checkout's, from the same commit.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-wasm
          path: ui/public
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The commit of this build, at /SOURCE.txt of every deployment (delivery.md 2.13). The checkout is shallow, so a
      # pull request's parents and tree come from the merge commit's header, the lines before its first blank line.
      - name: Write the source stamp
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -n "$PULL_REQUEST_URL" ]; then
            object="$(git cat-file commit "$GITHUB_SHA")"
            header="${object%%$'\n\n'*}"
            parents="$(sed -n 's/^parent //p' <<<"$header" | paste -sd ' ')"
            tree="$(sed -n 's/^tree //p' <<<"$header")"
          fi
          {
            echo "Source of this deployment of the Partsmith web app"
            echo "Repository: $REPOSITORY_URL"
            echo "Commit: $GITHUB_SHA"
            echo "Source archive: $REPOSITORY_URL/archive/$GITHUB_SHA.tar.gz"
            echo "Source archive in this deployment: /partsmith-source.tar.gz"
            if [ -n "$PULL_REQUEST_URL" ]; then
              echo "Pull request: $PULL_REQUEST_URL"
              echo "Parents: $parents"
              echo "Tree: $tree"
            fi
          } >dist/SOURCE.txt
      # The source archives of the sources job next to the stamp: OCCT's, Partsmith's and /dependencies/ with their
      # SHA256SUMS (delivery.md 2.13). check:dist then holds each file to the 25 MiB limit.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sources-web
          path: ui/dist
      - run: pnpm check:dist
      # check:dist does not look for the core, which acceptance test 8 requires.
      - name: Check that the build contains the web core
        run: |
          test -f dist/core/partsmith_core.wasm
          test -f dist/core/partsmith_core.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: ui/dist/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    needs: core-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-wasm
          path: ui/public
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The apt cache of delivery.md 3.2, as in e2e-engines.
      - name: Restore the apt archives of chromium
        id: apt-archives
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-ubuntu-24.04-chromium-${{ github.run_id }}
          restore-keys: apt-archives-ubuntu-24.04-chromium-
      - name: Copy the apt archives into apt's cache
        if: steps.apt-archives.outputs.cache-matched-key != ''
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # When the apt cache misses, its time is apt's download from the Ubuntu mirror: 19 s in run 41785469932 and
      # 7 min 42 s in CI run 28 (delivery.md 2.4 and open issue 16). The timeout ends such an install under this step's
      # name. The failed job is then rerun while the run is the newest of its concurrency group (delivery.md 2.14).
      - name: Install chromium and its system packages
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Copy the apt archives out of apt's cache
        id: copy-out
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          export LC_ALL=C
          dpkg-query -W -f '${Package}_${Version}_${Architecture}.deb\n' | sed 's/:/%3a/g' | sort > "$RUNNER_TEMP/apt-installed"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -12 - "$RUNNER_TEMP/apt-installed" > "$RUNNER_TEMP/apt-current"
          mkdir -p ~/apt-archives
          find ~/apt-archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -23 "$RUNNER_TEMP/apt-current" - > "$RUNNER_TEMP/apt-downloaded"
          if [ -s "$RUNNER_TEMP/apt-downloaded" ]; then
            rm -rf ~/apt-archives
            mkdir ~/apt-archives
            (cd /var/cache/apt/archives && xargs -a "$RUNNER_TEMP/apt-current" cp -t ~/apt-archives)
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the apt archives of chromium
        if: steps.copy-out.outputs.downloaded == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}
      - run: pnpm e2e
      # Its traces can hold the files the page loaded, the core among them. It is kept 7 days like the core. The run's
      # sources-web holds their source a day longer (delivery.md 2.13).
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  python:
    name: Python
    needs: occt-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      # Both interpreters go on PATH for the wheel test; the last one listed, 3.12, is the default python.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: |
            3.13
            3.12
      # maturin develop installs into the active virtual environment, so later steps activate it.
      - name: Create a virtual environment
        run: |
          python3.12 -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install maturin==1.15.0 pytest==9.1.1
      - run: maturin develop --release
        working-directory: python
      - run: pytest python/tests
      # One line per row of python-api.md section 5; a row over its budget warns, a row that cannot be measured fails.
      - name: Measure the Python budgets
        run: pytest python/tests -m budgets -s
      # Test 76: builds the release wheel and installs it with python3.12 and python3.13 (delivery.md test 10).
      - name: Build and install the wheel
        run: pytest python/tests -m packaging

  desktop:
    name: Desktop (Linux)
    needs: occt-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      # The apt cache of delivery.md 3.2, as in rust. Both jobs restore and save one entry of the Tauri Linux packages.
      # The second save of a run logs that its key is reserved, and passes.
      - name: Restore the apt archives of the Tauri Linux packages
        id: apt-archives
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-ubuntu-24.04-tauri-${{ github.run_id }}
          restore-keys: apt-archives-ubuntu-24.04-tauri-
      - name: Copy the apt archives into apt's cache
        if: steps.apt-archives.outputs.cache-matched-key != ''
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # When the apt cache misses, its time is apt's download from the Ubuntu mirror (delivery.md open issue 16). The
      # job's 60 minutes bound it (delivery.md 3.2).
      - name: Install the Tauri Linux packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Copy the apt archives out of apt's cache
        id: copy-out
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          export LC_ALL=C
          dpkg-query -W -f '${Package}_${Version}_${Architecture}.deb\n' | sed 's/:/%3a/g' | sort > "$RUNNER_TEMP/apt-installed"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -12 - "$RUNNER_TEMP/apt-installed" > "$RUNNER_TEMP/apt-current"
          mkdir -p ~/apt-archives
          find ~/apt-archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -23 "$RUNNER_TEMP/apt-current" - > "$RUNNER_TEMP/apt-downloaded"
          if [ -s "$RUNNER_TEMP/apt-downloaded" ]; then
            rm -rf ~/apt-archives
            mkdir ~/apt-archives
            (cd /var/cache/apt/archives && xargs -a "$RUNNER_TEMP/apt-current" cp -t ~/apt-archives)
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the apt archives of the Tauri Linux packages
        if: steps.copy-out.outputs.downloaded == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      # No WebAssembly core: the desktop app does not load it.
      - run: pnpm -C ui build
      - id: tauri-cli
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.12.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - run: cargo tauri build --bundles deb
        working-directory: desktop/src-tauri
      - name: Check the package
        run: |
          shopt -s nullglob
          packages=(target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .deb under target/release/bundle/deb/, found ${#packages[@]}."
            exit 1
          fi
          deb="${packages[0]}"
          members="$(dpkg-deb --fsys-tarfile "$deb" | tar -t)"
          # Tauri's bundler writes entries without the leading ./ that dpkg-deb --build writes; accept both.
          paths="$(sed 's|^\./||' <<<"$members")"
          if ! grep -qx 'usr/bin/partsmith-desktop' <<<"$paths"; then
            echo "::error::$deb does not contain usr/bin/partsmith-desktop."
            exit 1
          fi
          launchers="$(grep -c '^usr/share/applications/[^/]*\.desktop$' <<<"$paths" || true)"
          if [ "$launchers" -ne 1 ]; then
            echo "::error::$deb has $launchers .desktop files under usr/share/applications/, expected exactly one."
            exit 1
          fi
          # The notices resource (desktop.md 2.8), extracted by its member name as the list writes it.
          member="$(grep -xE '(\./)?usr/lib/Partsmith/THIRD-PARTY-NOTICES\.txt' <<<"$members" || true)"
          if [ -z "$member" ]; then
            echo "::error::$deb does not contain usr/lib/Partsmith/THIRD-PARTY-NOTICES.txt."
            exit 1
          fi
          if ! dpkg-deb --fsys-tarfile "$deb" | tar -xO "$member" | cmp - THIRD-PARTY-NOTICES.txt; then
            echo "::error::usr/lib/Partsmith/THIRD-PARTY-NOTICES.txt in $deb differs from THIRD-PARTY-NOTICES.txt."
            exit 1
          fi
          echo "$deb contains usr/bin/partsmith-desktop, one .desktop file and THIRD-PARTY-NOTICES.txt."

  # The jobs on Windows and macOS and in Firefox and WebKit. They moved here from platforms.yml in wave H, once they
  # had passed its two latest runs on main (delivery.md 2.14, The move, ADR 0038). No step sets continue-on-error: a
  # failure is fixed in the code or in a test. Until then it is recorded in delivery.md open issue 1 or ui.md open
  # issue 41.
  # occt-platforms is a job of its own: actions/cache saves in its post step only when its job succeeds. A cold OCCT
  # build is then saved even when the tests after it fail. The steps and the key are those of release.yml's bundle job.
  # platforms.yml keeps a copy of its macos-15 row for full-rebuild (delivery.md 2.14, promotion step 1).
  occt-platforms:
    name: OCCT (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    # A cold occt-platforms job took 21 minutes on macOS (2026-10-26, delivery.md open issue 16) and 1 h 10 min 21 s
    # on Windows (platforms run 14, delivery.md open issue 1 (e)).
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - id: occt
        uses: actions/cache@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
      # MSVC, CMake and Ninja from Visual Studio on PATH, needed only for a build.
      - if: runner.os == 'Windows' && steps.occt.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # The oldest macOS the app supports (desktop.md 2.8).
      - if: runner.os == 'macOS' && steps.occt.outputs.cache-hit != 'true'
        name: Install Ninja and set the deployment target
        run: |
          brew install ninja
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      # OCCT_JOBS spares the script nproc, which macOS lacks.
      - if: steps.occt.outputs.cache-hit != 'true'
        env:
          OCCT_JOBS: 4
        run: scripts/build-occt.sh native "$OCCT_ROOT"
      # A cold OCCT build is the largest user of the runner's disk (delivery.md open issue 16).
      - name: Disk space after the build
        if: always()
        run: df -h .

  rust-platforms:
    name: Rust tests (${{ matrix.runner }})
    needs: occt-platforms
    # needs waits for both OCCT rows; without this, one runner's failed build would skip the tests on both.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      # MSVC on PATH for the shim of partsmith-occt-sys.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # Git Bash puts GNU link (/usr/bin/link) ahead of MSVC's link.exe on PATH, and rustc takes the first one
      # when VCINSTALLDIR is set. This step gives Cargo the link.exe next to cl.exe, the one CMake uses for OCCT.
      - if: runner.os == 'Windows'
        name: Use the MSVC linker for Rust
        run: |
          linker="$(dirname "$(command -v cl)")/link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$linker")" >> "$GITHUB_ENV"
      # The shim and the test binaries are built for the macOS that OCCT and the app are built for.
      - if: runner.os == 'macOS'
        name: Set the deployment target
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      # Only a row whose own OCCT is missing fails here.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
          fail-on-cache-miss: true
      - run: rustup show active-toolchain || rustup toolchain install
      # Saved on main alone, where every later run can restore it. Also saved when the tests fail, since its post step
      # otherwise saves only after a passing job. A run while a failure is being fixed then restores the dependency
      # builds of the one before instead of building them cold (delivery.md 3.2). A run that a newer push cancels after
      # a key miss saves a partial cache. gh cache delete removes it (delivery.md 2.14, choice 1).
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # With --no-fail-fast, one failing test binary does not hide the others. A hung test binary ends this step. The
      # examples runner and clippy still run (delivery.md open issue 1 (g)).
      - id: crates
        timeout-minutes: 20
        run: cargo test --no-fail-fast -p partsmith-occt-sys -p partsmith-engine -p partsmith-desktop
      # The expected results blessed on Linux, at the tolerance of delivery.md 2.8. A block scalar, since a plain YAML
      # value cannot end in a colon.
      - if: ${{ !cancelled() && steps.crates.outcome != 'skipped' }}
        run: |
          cargo test -p partsmith-cli --test integration examples::
      # CI's workspace clippy runs on Linux only and never sees code behind #[cfg(windows)] or
      # #[cfg(target_os = "macos")], such as desktop.md tests 68 to 70.
      - if: ${{ !cancelled() && steps.crates.outcome != 'skipped' }}
        run: cargo clippy -p partsmith-occt-sys -p partsmith-engine -p partsmith-desktop --all-targets -- -D warnings
      # The app that the crate tests built imports the Universal C Runtime of Windows and no DLL of the Visual C++
      # Redistributable (delivery.md 3.6, ADR 0038).
      - name: Check the imports of the app
        if: ${{ !cancelled() && steps.crates.outcome != 'skipped' && runner.os == 'Windows' }}
        run: scripts/check-windows-imports.sh target/debug/partsmith-desktop.exe
      # The CLI that the examples runner ran. Its link takes the two link arguments of the Universal C Runtime from
      # .cargo/config.toml alone, where tauri-build gives them to the app by itself (delivery.md 3.6).
      - name: Check the imports of the CLI
        if: ${{ !cancelled() && steps.crates.outcome != 'skipped' && runner.os == 'Windows' }}
        run: scripts/check-windows-imports.sh target/debug/partsmith.exe
      - name: Disk space after the tests
        if: always()
        run: df -h .

  # e2e for one engine, against this run's core-wasm. Playwright runs the firefox and webkit projects only when
  # --project names them. Each runs the tests tagged @engines (ui.md 6.8). Firefox runs headed on the run's virtual
  # display; WebKit stays headless.
  e2e-engines:
    name: End-to-end tests (${{ matrix.browser }})
    needs: core-wasm
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-wasm
          path: ui/public
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The apt cache of delivery.md 3.2: the .deb files of the browser's system packages. The newest entry is restored
      # before the install. On main, a new entry is saved after it when the install downloaded a package the entry
      # lacked.
      - name: Restore the apt archives of ${{ matrix.browser }}
        id: apt-archives
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-ubuntu-24.04-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: apt-archives-ubuntu-24.04-${{ matrix.browser }}-
      - name: Copy the apt archives into apt's cache
        if: steps.apt-archives.outputs.cache-matched-key != ''
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # When the apt cache misses, its time is apt's download from the Ubuntu mirror: under 3 minutes on most runs and
      # up to 53 on a slow mirror (delivery.md 2.14 and open issue 16). The timeout ends such an install under this
      # step's name. The row fails at about 11 minutes instead of running into the job's 60. The failed rows are then
      # rerun while the run is the newest of its concurrency group (delivery.md 2.14).
      - name: Install ${{ matrix.browser }} and its system packages
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Saved right after the install, not in a post step. A test that fails later still leaves the entry
      # (delivery.md 3.2).
      - name: Copy the apt archives out of apt's cache
        id: copy-out
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          export LC_ALL=C
          dpkg-query -W -f '${Package}_${Version}_${Architecture}.deb\n' | sed 's/:/%3a/g' | sort > "$RUNNER_TEMP/apt-installed"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -12 - "$RUNNER_TEMP/apt-installed" > "$RUNNER_TEMP/apt-current"
          mkdir -p ~/apt-archives
          find ~/apt-archives -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | comm -23 "$RUNNER_TEMP/apt-current" - > "$RUNNER_TEMP/apt-downloaded"
          if [ -s "$RUNNER_TEMP/apt-downloaded" ]; then
            rm -rf ~/apt-archives
            mkdir ~/apt-archives
            (cd /var/cache/apt/archives && xargs -a "$RUNNER_TEMP/apt-current" cp -t ~/apt-archives)
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the apt archives of ${{ matrix.browser }}
        if: steps.copy-out.outputs.downloaded == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}
      - run: xvfb-run --auto-servernum pnpm e2e --project ${{ matrix.browser }}
      # Its traces can hold the files the page loaded, the core among them. It is kept 7 days like the core. The run's
      # sources-web holds their source a day longer (delivery.md 2.13).
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [kernel-wasm, rust, deny, ui, schema, web, e2e, python, desktop, occt-platforms, rust-platforms, e2e-engines]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Cloudflare secrets are not available to this run (a fork, or the repository is not configured), so nothing was deployed."
          fi
      - if: steps.secrets.outputs.available == 'true'
        uses: actions/checkout@v7.0.1
      - if: steps.secrets.outputs.available == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: ui/dist
      # No deployment goes out without the stamp that names its source (delivery.md 2.13).
      - if: steps.secrets.outputs.available == 'true'
        name: Check the source stamp
        run: |
          if ! grep -qxF "Commit: $GITHUB_SHA" ui/dist/SOURCE.txt 2>/dev/null; then
            echo "::error title=Source stamp missing::ui/dist/SOURCE.txt does not name the commit $GITHUB_SHA, so nothing was deployed. The web job writes it (docs/spec/delivery.md section 2.13)."
            exit 1
          fi
      # Nor without OCCT's source: a whole gzip file whose tar names the pinned OCCT commit (delivery.md 2.13).
      - if: steps.secrets.outputs.available == 'true'
        name: Check the OCCT source archive
        run: |
          source scripts/occt-version.sh
          archive="ui/dist/occt-$OCCT_VERSION-source.tar.gz"
          if ! scripts/check-source-archive.sh "$archive" "$OCCT_COMMIT"; then
            echo "::error title=OCCT source missing::$archive is missing or does not hold the source of the OCCT commit $OCCT_COMMIT, so nothing was deployed. The sources job writes it, and the web job puts it into the build (docs/spec/delivery.md section 2.13)."
            exit 1
          fi
      # Nor without the source of the Rust crates and npm packages it is made from (delivery.md 2.13): SHA256SUMS lists
      # the first part of both archives and every part of the folder, each part has the SHA-256 it lists, and the
      # joined parts make whole archives. GNU tar reads a tar cut between two entries as whole. Only SHA256SUMS then
      # shows the missing part.
      - if: steps.secrets.outputs.available == 'true'
        name: Check the dependency source archives
        run: |
          if ! (cd ui/dist/dependencies &&
            grep -q '  rust-crates-web\.tar\.gz\.part-00$' SHA256SUMS &&
            grep -q '  npm-packages-web\.tar\.part-00$' SHA256SUMS &&
            sha256sum --check --strict --quiet SHA256SUMS &&
            for part in *.part-*; do cut -c 67- SHA256SUMS | grep -qxF -- "$part" || exit 1; done &&
            cat rust-crates-web.tar.gz.part-* | gzip -t &&
            cat npm-packages-web.tar.part-* | tar -t >/dev/null) >/dev/null 2>&1; then
            echo "::error title=Dependency source missing::ui/dist/dependencies does not hold every part of rust-crates-web.tar.gz and npm-packages-web.tar with the SHA-256 that its SHA256SUMS lists, so nothing was deployed. The sources job writes them, and the web job puts them into the build (docs/spec/delivery.md section 2.13)."
            exit 1
          fi
      # Nor without Partsmith's own source: a whole gzip file whose tar names the run's commit, checked as OCCT's is.
      - if: steps.secrets.outputs.available == 'true'
        name: Check the Partsmith source archive
        run: |
          archive=ui/dist/partsmith-source.tar.gz
          if ! scripts/check-source-archive.sh "$archive" "$GITHUB_SHA"; then
            echo "::error title=Partsmith source missing::$archive is missing or does not hold the source of the commit $GITHUB_SHA, so nothing was deployed. The sources job writes it, and the web job puts it into the build (docs/spec/delivery.md section 2.13)."
            exit 1
          fi
      - if: steps.secrets.outputs.available == 'true'
        id: pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: >-
            pages deploy ui/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'partsmith' }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
      - if: steps.secrets.outputs.available == 'true'
        run: echo "Deployed to ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
