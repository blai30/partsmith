name: Release

# A version tag builds the desktop bundles and drafts a GitHub Release that a human publishes.
# A manual run is a dry run: it builds the bundles and uploads them with their source artifact, with no release.
# Start a dry run from main before each tag: it proves the bundles, and it saves the Windows and macOS
# caches on main, the only scope a tag run can restore them from (GitHub drops caches unused for 7 days).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OCCT_ROOT: ${{ github.workspace }}/.occt/native

jobs:
  verify:
    name: Verify the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    # pipefail, so a failing cargo metadata fails the step instead of reading as an empty version.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Check that the tag names the version of the app
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          desktop_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "partsmith-desktop") | .version')"
          ui_version="$(jq -r .version ui/package.json)"
          mismatch=false
          # An empty version (no partsmith-desktop package) differs from the tag too.
          if [ "$desktop_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version does not match the version $desktop_version of partsmith-desktop and ui/package.json."
            mismatch=true
          fi
          # A version both files share is reported once.
          if [ "$ui_version" != "$tag_version" ] && [ "$ui_version" != "$desktop_version" ]; then
            echo "::error::Tag v$tag_version does not match the version $ui_version of partsmith-desktop and ui/package.json."
            mismatch=true
          fi
          if [ "$mismatch" = true ]; then
            exit 1
          fi
      - name: Check that CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq length)"
          if [ "$passed" != 1 ]; then
            echo "::error::CI has not passed for $GITHUB_SHA. Tag a commit whose CI run succeeded."
            exit 1
          fi

  # The source of the bundles, uploaded before any bundle and kept a day longer (delivery.md 2.13, The source with every
  # artifact). draft attaches these files to the release.
  sources:
    name: Source archives (desktop)
    needs: verify
    # verify is skipped in a dry run, and the archives are still made.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      # The OCCT source archive, made from the pinned tag in every run. A release attaches no archive from a cache entry
      # that another run wrote (delivery.md 2.13, Made in the sources jobs).
      - run: |
          mkdir -p .occt/source
          scripts/occt-source-archive.sh .occt/source
      # cargo vendor and cargo metadata of the dependency script need the toolchain of rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      # It checks the archive's commit, as deploy does, and prints its SHA-256. It warns, without failing, when
      # the runner's git or gzip wrote other bytes than the ones 2.13 measured.
      - name: Write the OCCT source archive
        env:
          OCCT_SOURCE_SHA256: bb71bf7473f9a278648f3ff96e28bd50afe49bf8d6e53ab55e883b54d0220155
        run: |
          source scripts/occt-version.sh
          archive="occt-$OCCT_VERSION-source.tar.gz"
          mkdir sources
          cp ".occt/source/$archive" sources/
          if ! scripts/check-source-archive.sh "sources/$archive" "$OCCT_COMMIT"; then
            echo "::error title=OCCT source missing::sources/$archive from the cache .occt/source is not a whole gzip file or does not hold the source of the OCCT commit $OCCT_COMMIT, so nothing was uploaded. Delete that cache entry (gh cache list --key occt-source-) and run the job again, which makes the archive anew (docs/spec/delivery.md section 2.13)."
            exit 1
          fi
          sha256="$(sha256sum "sources/$archive" | cut -d ' ' -f 1)"
          echo "$sha256  $archive"
          if [ "$sha256" != "$OCCT_SOURCE_SHA256" ]; then
            echo "::warning title=OCCT source archive changed::$archive has the SHA-256 $sha256, not $OCCT_SOURCE_SHA256, the one docs/spec/delivery.md section 2.13 records. A new pin, git or gzip wrote other bytes: record the new SHA-256 there and in OCCT_SOURCE_SHA256 of each step Write the OCCT source archive."
          fi
      # git archive of the checked-out commit, in a tag run the tagged commit.
      - name: Write the Partsmith source archive
        run: scripts/partsmith-source-archive.sh sources
      # The source of every Rust crate and npm package the bundles are made from, and of tauri-cli, as parts that draft's
      # SHA256SUMS covers. A lock file the script cannot archive fails the dry run, not the tag.
      - name: Write the dependency source archives
        run: node scripts/dependency-source-archive.mjs desktop sources
      # The files are gzip files and tars of gzip files, which zip does not shrink.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sources-desktop
          path: sources/
          retention-days: 8
          if-no-files-found: error
          compression-level: 0

  bundle:
    name: Bundle (${{ matrix.runner }})
    needs: [verify, sources]
    # It runs in a dry run, where verify is skipped, and never without the run's source artifact.
    if: ${{ !cancelled() && needs.sources.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bundles: deb,rpm
            files: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm
          - runner: windows-2025
            bundles: nsis
            files: target/release/bundle/nsis/*-setup.exe
          - runner: macos-15
            bundles: app,dmg
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    # Above the cold release budget of 120 minutes, and far below GitHub's default of 360 for a hung job
    # (delivery.md 2.5).
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Linux'
        name: Install the Tauri Linux packages and Ninja
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev ninja-build
      # MSVC, CMake and Ninja from Visual Studio on PATH.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # Git Bash puts GNU link (/usr/bin/link) ahead of MSVC's link.exe on PATH, and rustc takes the first one
      # when VCINSTALLDIR is set, so Cargo gets the link.exe next to cl.exe, the one CMake uses for OCCT.
      - if: runner.os == 'Windows'
        name: Use the MSVC linker for Rust
        run: |
          linker="$(dirname "$(command -v cl)")/link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$linker")" >> "$GITHUB_ENV"
      # The oldest macOS the app supports, for OCCT, Rust and the bundle (desktop.md 2.8).
      - if: runner.os == 'macOS'
        name: Install Ninja and set the deployment target
        run: |
          brew install ninja
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - id: occt
        uses: actions/cache@v6.1.0
        with:
          path: .occt/native
          key: occt-native-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh', 'scripts/occt-version.sh') }}
      # OCCT_JOBS spares the script nproc, which macOS lacks.
      - if: steps.occt.outputs.cache-hit != 'true'
        env:
          OCCT_JOBS: 4
        run: scripts/build-occt.sh native "$OCCT_ROOT"
      - run: rustup show active-toolchain || rustup toolchain install
      # A tag run's caches are scoped to its tag and no later tag restores them, so only a dry run
      # started from main saves the Rust cache, where every tag run can restore it.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - id: tauri-cli
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: tauri-cli-2.12.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - run: cargo tauri build --bundles ${{ matrix.bundles }} --ci
        working-directory: desktop/src-tauri
      # The app the installer holds imports no DLL of the Visual C++ Redistributable (delivery.md 3.6, ADR 0038).
      # The run text is the one of platforms.yml's rust-platforms job, character for character.
      - name: Check the imports of the app
        if: runner.os == 'Windows'
        env:
          EXECUTABLE: target/release/partsmith-desktop.exe
        run: |
          # Options start with -, since Git Bash turns an argument that starts with / into a path. dumpbin's exit status
          # is not used: the listing decides, and a missing dumpbin lists nothing.
          listing="$(dumpbin -nologo -dependents "$EXECUTABLE" | tr -d '\r')" || true
          echo "$listing"
          # Each line of the listing without its leading spaces.
          lines="$(sed 's/^ *//' <<< "$listing")"
          if ! grep -q -x -F 'Image has the following dependencies:' <<< "$lines"; then
            echo "::error title=Imports not checked::dumpbin listed no imports of $EXECUTABLE, so the C runtime it imports was not checked. The steps that set up MSVC and build the app run before this one (docs/spec/delivery.md section 3.6)."
            exit 1
          fi
          # The DLLs of the Visual C++ Redistributable, delay-loaded ones included, in the listing's order. The digit
          # after the prefix leaves out msvcp_win.dll and msvcrt.dll, which are part of Windows.
          mapfile -t runtime < <(grep -i -E '^(msvcp|msvcr|vcruntime|concrt|vcomp|vccorlib|vcamp|mfc|mfcm)[0-9][^ ]*\.dll$' <<< "$lines")
          if [ "${#runtime[@]}" -gt 0 ]; then
            names="$(printf ', %s' "${runtime[@]}")"
            echo "::error title=Visual C++ runtime imported::$EXECUTABLE imports ${names#, }, which only the Visual C++ Redistributable installs. On Windows, OCCT, the shim and every Rust crate link the Visual C++ runtime and the C++ standard library statically (docs/spec/delivery.md section 3.6)."
            exit 1
          fi
      # One flat folder, so the release assets and SHA256SUMS name the files without folders.
      - name: Collect the bundles
        env:
          BUNDLE_FILES: ${{ matrix.files }}
        run: |
          mkdir bundles
          # Unquoted, so each pattern expands; a pattern that matches nothing fails the copy.
          # shellcheck disable=SC2086
          cp $BUNDLE_FILES bundles/
      # Kept 7 days, not the repository's default of 90: anyone signed in to GitHub can download it.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ runner.os }}
          path: bundles/
          retention-days: 7
          if-no-files-found: error

  draft:
    name: Draft the release
    needs: [bundle, sources]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # The tagged commit, for its THIRD-PARTY-NOTICES.txt; checkout empties the workspace, so it comes first.
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true
      # OCCT's and Partsmith's source archives and the parts of the dependency archives, which the sources job made
      # from the tagged commit and the desktop notices name (delivery.md 2.13). SHA256SUMS covers them too.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sources-desktop
          path: release
      # The desktop app's notices are a release asset, which SHA256SUMS covers too (delivery.md 2.9).
      - name: Add the third-party notices
        run: cp THIRD-PARTY-NOTICES.txt release/
      - name: Write SHA256SUMS
        working-directory: release
        run: |
          # Byte order, so the files sort by name the same everywhere.
          export LC_ALL=C
          sha256sum -- * > SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Partsmith $VERSION" --generate-notes release/*
