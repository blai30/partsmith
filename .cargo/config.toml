[target.wasm32-unknown-emscripten]
# Native wasm exceptions match the OCCT build (ADR 0003); memory grows up to the wasm32 limit.
rustflags = [
  "-C", "link-arg=-fwasm-exceptions",
  "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
  "-C", "link-arg=-sMAXIMUM_MEMORY=4GB",
  "-C", "link-arg=-sSTACK_SIZE=4MB",
]
runner = "node"

[target.x86_64-pc-windows-msvc]
# The Visual C++ runtime and the C++ standard library linked statically, as OCCT and the shim link them on Windows.
# The app then imports no DLL of the Visual C++ Redistributable (delivery.md section 3.6, ADR 0038).
rustflags = ["-C", "target-feature=+crt-static"]
# Rustdoc reads these flags and not the rustflags. Doc tests then link the same runtime.
rustdocflags = ["-C", "target-feature=+crt-static"]
