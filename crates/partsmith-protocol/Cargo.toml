serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
partsmith-budgets.workspace = true
proptest.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"

[[bench]]
name = "budgets"
harness = false
