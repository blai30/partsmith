[package]
name = "partsmith-cli"
description = "The partsmith command line: validate, format, rebuild and export models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "partsmith"
path = "src/main.rs"

[dependencies]
# The `string` feature lets the version text come from the engine at run time.
clap = { workspace = true, features = ["string"] }
partsmith-engine.workspace = true
partsmith-model.workspace = true
partsmith-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
