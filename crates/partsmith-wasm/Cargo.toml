[package]
name = "partsmith-wasm"
description = "WebAssembly entry point that runs the Partsmith engine in a browser worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The web core module. Emscripten embeds the .wasm file name in the .js loader, so the binary
# carries the published name `partsmith_core` (protocol.md section 2.10, scripts/build-wasm.sh).
# Its logic lives in the library, and a test harness linked with the module's link arguments
# would never run, so the binary has no unit tests.
[[bin]]
name = "partsmith_core"
path = "src/main.rs"
test = false

# The `ps_call` budget of protocol.md section 5.
[[bench]]
name = "budgets"
harness = false

[dependencies]
partsmith-engine.workspace = true

[dev-dependencies]
partsmith-budgets.workspace = true
partsmith-model.workspace = true
partsmith-protocol.workspace = true
proptest.workspace = true
serde_json.workspace = true

# The workspace table with `unsafe_code` denied instead of forbidden, so exactly the three
# C ABI exports can allow it (ADR 0010).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
