[package]
name = "partsmith-recompute"
description = "Dependency graph, dirty tracking and cached recompute of the Partsmith feature timeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary: tests/integration.rs declares every other file of tests/ as a module, except
# the targets below (ADR 0035).
autotests = false

[dependencies]
blake3.workspace = true
partsmith-features.workspace = true
partsmith-model.workspace = true
partsmith-naming.workspace = true
serde_json.workspace = true

[dev-dependencies]
partsmith-budgets.workspace = true
partsmith-message-lint.workspace = true
partsmith-occt-sys.workspace = true
partsmith-sketch.workspace = true
proptest.workspace = true
schemars.workspace = true
serde.workspace = true

[features]
# Builds the test target reference_stability, the reference stability corpus
# (docs/design/reference-stability-corpus.md), which records the study's scenarios and fails until
# the study's plan is implemented.
stability-study = []

# Its modules include the release-only budgets of tests/feature_<type>.rs, which stay in the files
# of the features they time and are timed beside the other tests: run them at the default thread
# count on an otherwise idle machine (ADR 0035).
[[test]]
name = "integration"

# The reference stability corpus. Naming it without the feature is an error, not an empty run.
[[test]]
name = "reference_stability"
required-features = ["stability-study"]

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
