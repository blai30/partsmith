[package]
name = "partsmith-recompute"
description = "Dependency graph, dirty tracking and cached recompute of the Partsmith feature timeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary: tests/integration.rs declares every other file of tests/ as a module, except
# the targets below (ADR 0035).
autotests = false

[dependencies]
blake3.workspace = true
partsmith-features.workspace = true
partsmith-model.workspace = true
partsmith-naming.workspace = true
serde_json.workspace = true

[dev-dependencies]
partsmith-budgets.workspace = true
partsmith-message-lint.workspace = true
partsmith-occt-sys.workspace = true
partsmith-sketch.workspace = true
proptest.workspace = true
schemars.workspace = true
serde.workspace = true

[[test]]
name = "integration"

# The release-only build-time budgets of the per-feature specs and features.md section 5, a module
# per feature named like its tests/feature_<type>.rs, timed one at a time and never beside the
# tests of the other files.
[[test]]
name = "budgets"

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
