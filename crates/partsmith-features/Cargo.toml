[package]
name = "partsmith-features"
description = "Feature trait, registry and built-in modeling features for Partsmith."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary: tests/integration.rs declares every other file of tests/ as a module, except
# the targets below (ADR 0035).
autotests = false

[dependencies]
partsmith-mesh.workspace = true
partsmith-model.workspace = true
partsmith-naming.workspace = true
partsmith-occt-sys.workspace = true
partsmith-sketch.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
partsmith-message-lint.workspace = true
proptest.workspace = true

[[test]]
name = "integration"

# The release-only budgets of features.md section 5, timed beside only each other, never beside
# the tests of the other files.
[[test]]
name = "budgets"

[lints]
workspace = true
