[package]
name = "partsmith-occt-sys"
description = "Safe Rust facade over a C++ shim around the OCCT geometry kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

links = "occt"
build = "build.rs"

[dependencies]
cxx.workspace = true
partsmith-mesh.workspace = true
thiserror.workspace = true

[build-dependencies]
cxx-build.workspace = true

[[bench]]
name = "budgets"
harness = false

# The FFI crate is the one place allowed to use unsafe code.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
