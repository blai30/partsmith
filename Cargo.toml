[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/blai30/partsmith"
authors = ["The Partsmith Contributors"]

[workspace.dependencies]
partsmith-model = { path = "crates/partsmith-model" }
partsmith-mesh = { path = "crates/partsmith-mesh" }
partsmith-sketch = { path = "crates/partsmith-sketch" }
partsmith-naming = { path = "crates/partsmith-naming" }
partsmith-occt-sys = { path = "crates/partsmith-occt-sys" }
partsmith-features = { path = "crates/partsmith-features" }
partsmith-recompute = { path = "crates/partsmith-recompute" }
partsmith-print = { path = "crates/partsmith-print" }
partsmith-io = { path = "crates/partsmith-io" }
partsmith-protocol = { path = "crates/partsmith-protocol" }
partsmith-engine = { path = "crates/partsmith-engine" }
# Dev-only crates (ADR 0027).
partsmith-budgets = { path = "crates/partsmith-budgets" }
partsmith-mesh-fixtures = { path = "crates/partsmith-mesh-fixtures" }
partsmith-message-lint = { path = "crates/partsmith-message-lint" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ryu = "1"
getrandom = "0.4"
blake3 = "1"
cxx = "1"
cxx-build = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
pyo3 = "0.29"
proptest = "1"
pretty_assertions = "1"
tempfile = "3"
# Tauri's crates move together, so they are pinned exactly (ADR 0014).
tauri = "=2.12.3"
tauri-build = "=2.7.2"
tauri-plugin-dialog = "=2.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Size-optimized profile for the WebAssembly core.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "unwind"
