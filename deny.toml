# cargo-deny policy: permissive licenses only (technical design section 17).
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Both come from the gtk-rs 0.18 stack of Tauri's WebKitGTK webview on Linux (ADR 0014, delivery.md 3.2).
# Remove them when Tauri moves past gtk-rs 0.18.
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter is unsound; Partsmith does not call it. It comes with Tauri's gtk-rs 0.18 stack; remove when Tauri moves past gtk-rs 0.18." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; it is a build-time dependency of the gtk-rs 0.18 macros. Remove when Tauri moves past gtk-rs 0.18." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
